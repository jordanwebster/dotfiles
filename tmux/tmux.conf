# tmux configuration.
#
# Deliberately plugin-free. Everything below is a built-in tmux setting, so a
# fresh machine needs nothing but tmux itself — no plugin manager to bootstrap
# and no network fetch before the first session works.

# --- Terminal and colour -----------------------------------------------------

# Inside tmux, TERM must be tmux-256color (not xterm-*: programs would think
# they're in a plain xterm). The features line tells tmux the OUTER terminal
# supports 24-bit colour — it must match the outer $TERM (ghostty locally;
# xterm-256color kept for ssh'd sessions).
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"

# Claude Code assumes anything running under tmux is limited to the 256-colour
# palette and quantises its output accordingly, which turns its terracotta
# accent a muted pink. The RGB feature above means 24-bit colour does survive
# the trip through tmux, so tell it to keep emitting it.
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1

# Forward modified keys (Shift+Enter etc.) to apps that request them (Claude
# Code does): tmux must ask the outer terminal for extended keys, and — as
# with RGB above — be told the outer terminal supports them.
set -s extended-keys on
set -as terminal-features ",xterm-ghostty:extkeys"

set -g mouse on

# --- Prefix ------------------------------------------------------------------

unbind C-b
set -g prefix C-a
bind C-a send-prefix   # prefix twice sends a literal C-a to the program inside

# --- Windows and panes -------------------------------------------------------

# Count from 1: the number keys then line up with the windows they select,
# with no unreachable 0 at the far end of the row.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on   # closing window 2 of 3 leaves 1,2 — not 1,3

# --- Sensible defaults -------------------------------------------------------
#
# The settings tmux-sensible provides, set directly: eight options and four
# bindings is not worth a plugin manager to obtain.

# Without this, pressing Escape in nvim inside tmux stalls while tmux waits to
# see whether more bytes of an escape sequence are coming.
set -s escape-time 0

set -g history-limit 50000   # survive scrolling back through a long build log
set -g display-time 4000     # messages readable rather than glimpsed
set -g status-interval 5     # so a clock in the status line is never far wrong

# emacs keys at the tmux command prompt (prefix + :) are better than vi keys
# even for vi users, because that prompt is a single line.
set -g status-keys emacs

# Let programs in a pane know when they gain or lose focus, so nvim's autoread
# and similar "did the outside world change?" checks fire on a pane switch.
set -g focus-events on

# Size a window to the smallest client actually looking at it, rather than the
# smallest attached to the session. Matters with grouped sessions.
setw -g aggressive-resize on

bind a last-window
bind C-p previous-window
bind C-n next-window
bind R source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# --- Splits ------------------------------------------------------------------

# | and - picture the split they produce, which " and % do not. New splits and
# windows open in the current pane's directory rather than the one the session
# was started in.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Move between panes, and resize them with shift held. Both repeat, so the
# prefix is pressed once and then the key tapped.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Copy mode ---------------------------------------------------------------

setw -g mode-keys vi

# Select and yank as vi does, and put the result on the macOS clipboard rather
# than only in tmux's own paste buffer.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Releasing a mouse drag copies the selection without also scrolling back to
# the prompt, which is what the default binding does.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "pbcopy"

# --- Status line -------------------------------------------------------------
#
# Colours are palette indices (colour0-15) rather than hex, so the status line
# follows whatever theme the terminal is set to instead of fighting it.

set -g status-style "bg=default,fg=colour7"
set -g status-left " #[fg=colour4,bold]#S#[default] "
set -g status-right "#[fg=colour3]#{?client_prefix,PREFIX ,}#[fg=colour8]%H:%M "
setw -g window-status-current-style "fg=colour4,bold"
set -g pane-active-border-style "fg=colour4"
set -g pane-border-style "fg=colour8"
